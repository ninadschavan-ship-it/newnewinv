<style>
:root{--gold:#f3d18b;--cream:#fff3df;--wine:#270711;--teal:#082b2b}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity;background:#18050c}body{margin:0;background:radial-gradient(ellipse at top,#4b1428 0,#1c0610 55%,#07090a 100%);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}.ambient{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.petal{position:absolute;top:-10vh;width:8px;height:12px;background:linear-gradient(135deg,#ffd6dc,#d92758);border-radius:80% 0 80% 0;opacity:.65;animation:fall linear infinite;filter:drop-shadow(0 0 5px #ffb2c5)}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(600deg)}}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6a4;box-shadow:0 0 12px 3px #e8ac51;animation:twinkle 2.6s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.12;transform:scale(.7)}to{opacity:.95;transform:scale(1.5)}}.page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px);position:relative;scroll-snap-align:start;isolation:isolate}.page::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 40%,rgba(178,87,95,.18),transparent 58%)}.page.save-page{background:radial-gradient(ellipse at 50% 25%,#17494a 0%,#092526 42%,#071012 100%)}.page.save-page::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.45;background-image:radial-gradient(#f7d99b 1px,transparent 1.6px),radial-gradient(#fff2cf 1px,transparent 1.6px);background-size:53px 61px,97px 89px;background-position:0 0,22px 35px;animation:stars 16s linear infinite}@keyframes stars{to{background-position:53px 61px,119px 124px}}.art-wrap{position:relative;width:min(100%,min(68vh,540px));max-height:94svh;aspect-ratio:9/16;border:1px solid rgba(244,207,133,.68);border-radius:18px;overflow:hidden;box-shadow:0 0 0 5px rgba(222,170,84,.09),0 24px 85px rgba(0,0,0,.58),0 0 55px rgba(255,174,82,.14);transform:translateY(22px) scale(.985);opacity:0;transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}.page.visible .art-wrap{opacity:1;transform:translateY(0) scale(1)}.art-wrap img{display:block;width:100%;height:100%;object-fit:cover}.art-wrap::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 45px rgba(32,5,12,.14);pointer-events:none}.open-hint{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:8;color:#ffe4a6;text-shadow:0 1px 10px #3a0713;font-size:clamp(13px,2.7vw,18px);letter-spacing:.06em;white-space:nowrap;animation:bob 1.8s ease-in-out infinite;cursor:pointer;border:0;background:transparent;font-family:inherit}@keyframes bob{50%{transform:translate(-50%,-7px)}}.open-cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#5b1830,#1b050d 75%);transition:opacity 1.1s ease,visibility 1.1s ease}.open-cover.dismissed{opacity:0;visibility:hidden;pointer-events:none}.cover-card{width:min(78vw,390px);text-align:center;animation:coverFloat 3.5s ease-in-out infinite}.cover-card img{width:100%;height:auto;max-height:75svh;object-fit:contain;filter:drop-shadow(0 15px 35px #0009)}.cover-button{display:inline-flex;align-items:center;gap:10px;border:1px solid #e9c47a;border-radius:99px;padding:12px 24px;margin-top:14px;background:rgba(36,6,16,.6);color:#ffe8b4;font:500 19px 'Cormorant Garamond',serif;letter-spacing:.05em;cursor:pointer;box-shadow:0 0 24px #d9a34b22}.cover-button:hover{background:#5c1830}.cover-button span{font-size:22px;animation:bob 1.6s infinite}@keyframes coverFloat{50%{transform:translateY(-8px)}}.tools{position:fixed;z-index:12;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}.tools a,.tools button{border:1px solid #f0ce88aa;background:rgba(24,5,12,.78);backdrop-filter:blur(10px);color:#ffe9bd;text-decoration:none;border-radius:30px;padding:9px 13px;font:500 14px 'Cormorant Garamond',serif;cursor:pointer}.tools a:hover,.tools button:hover{background:#683044}.scroll-note{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.12em;color:#f7d99b;opacity:.85;white-space:nowrap}.arrow{display:inline-block;margin-left:7px;animation:bob 1.6s infinite}.page-count{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.22em;color:#f8dca0;opacity:.8}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:30;background:#f5dfb4;color:#32101a;padding:11px 18px;border-radius:30px;transition:.3s;pointer-events:none;text-align:center;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.page{padding:10px 12px 35px}.art-wrap{width:min(100%,calc((100svh - 52px)*.5625));max-height:calc(100svh - 58px);border-radius:12px}.tools{top:8px;right:8px;gap:5px}.tools a,.tools button{font-size:12px;padding:7px 10px}.cover-card{width:min(86vw,360px)}.page-count{top:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

<script>
const cover=document.getElementById('cover');function openInvite(){cover.classList.add('dismissed');document.body.style.overflow='';setTimeout(()=>document.getElementById('page1').scrollIntoView({behavior:'smooth'}),250)}document.getElementById('openInvite').addEventListener('click',openInvite);document.getElementById('tapOpen').addEventListener('click',openInvite);
const sections=[...document.querySelectorAll('.page')];const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible')}}),{threshold:.25});sections.forEach(s=>observer.observe(s));
const ambient=document.getElementById('ambient');for(let i=0;i<25;i++){let p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'%';p.style.animationDuration=(10+Math.random()*17)+'s';p.style.animationDelay=(-Math.random()*22)+'s';p.style.setProperty('--drift',(Math.random()*160-80)+'px');p.style.opacity=(.2+Math.random()*.55);ambient.appendChild(p)}for(let i=0;i<28;i++){let s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(-Math.random()*3)+'s';ambient.appendChild(s)}
